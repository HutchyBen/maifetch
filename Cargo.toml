[package]
name = "maifetch"
version = "0.1.0"
edition = "2021"
description = "A lazy fetch tool for MaiTea"
license = "MIT"

[dependencies]
clap = { version = "4.5.23", features = ["derive"] }
dirs = "5.0.1"
image = { version = "0.25.5", default-features = false, features = ["jpeg", "png"] }
reqwest = { version = "0.12.11", default-features = false, features = ["blocking", "json", "native-tls"] }
serde = { version = "1.0.217", features = ["derive"] }
serde_json = "1.0.134"
