name: Java 8 CI

on:
  push:
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "8"

      - name: Compile
        shell: bash
        run: |
          mkdir -p build/classes build/test-classes
          javac -source 8 -target 8 -encoding UTF-8 -d build/classes $(find src/main/java -name '*.java')
          javac -source 8 -target 8 -encoding UTF-8 -cp build/classes -d build/test-classes $(find src/test/java -name '*.java')

      - name: Test
        run: java -cp build/classes:build/test-classes maifetch.MaifetchTests

      - name: CLI smoke test
        run: java -cp build/classes maifetch.Maifetch --help
